# Local development only: adds PostgreSQL, Valkey and Mailpit and points the app at them.
# All published ports (API included) are bound to 127.0.0.1. The infra ports also let the app
# run on the host (npm run dev:*) against these containers.
# Host ports are overridable (defaults in brackets), e.g. to run a second, isolated project:
#   POSTGRES_PUBLISHED_PORT [5432], VALKEY_PUBLISHED_PORT [6379], MAILPIT_SMTP_PUBLISHED_PORT [1025],
#   MAILPIT_UI_PUBLISHED_PORT [8025], API_PUBLISHED_PORT [3000], API_OPS_PUBLISHED_PORT [9100]
#   POSTGRES_PUBLISHED_PORT=15432 ... docker compose -p ns-smoke up -d   (see scripts/smoke-local.sh)
# The app services never read the stage/production env_file locally (env_file: !reset []).
x-local-env: &local-env
  APP_ENV: local
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  DATABASE_URL: postgres://notifications:notifications@postgres:5432/notifications
  DATABASE_SSL: 'false'
  VALKEY_URL: redis://valkey:6379

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: notifications
      POSTGRES_DB: notifications
    ports:
      - '127.0.0.1:${POSTGRES_PUBLISHED_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notifications -d notifications']
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:9.1.2-alpine
    command:
      - valkey-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    ports:
      - '127.0.0.1:${VALKEY_PUBLISHED_PORT:-6379}:6379'
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PUBLISHED_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PUBLISHED_PORT:-8025}:8025'

  migrate:
    env_file: !reset []
    environment: *local-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    env_file: !reset []
    environment: *local-env
    # Replace (not merge) the base port mapping so the API is reachable only from this host.
    ports: !override
      - '127.0.0.1:${API_PUBLISHED_PORT:-3000}:3000'
      - '127.0.0.1:${API_OPS_PUBLISHED_PORT:-9100}:${OPS_PORT:-9100}'
    depends_on:
      postgres:
        condition: service_healthy

  dispatcher:
    env_file: !reset []
    environment: *local-env
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  worker-email:
    env_file: !reset []
    environment: *local-env
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      mailpit:
        condition: service_started

  # One-shot, local only: applies config/local.example.json without Node on the host.
  #   docker compose run --rm config-apply                              # default file
  #   docker compose run --rm config-apply --file /config/<other>.json  # any file under ./config
  # New API keys are printed once on stdout.
  config-apply:
    image: ${NOTIFICATION_SERVICE_IMAGE:-notification-service:local}
    build:
      context: .
      dockerfile: docker/Dockerfile
    profiles: ['tools']
    restart: 'no'
    entrypoint: ['node', 'dist/entrypoints/config-apply.js']
    command: ['--file', '/config/local.example.json']
    environment:
      <<: *local-env
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SECRETS_DIR: /run/secrets
    volumes:
      - ./config:/config:ro
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  valkey-data:
