# Example (stage/production): provider credentials as Docker secrets, for `file:<name>` secretRefs.
# A `file:resend_main` ref with key `apiKey` reads $SECRETS_DIR/resend_main_api_key, i.e.
# /run/secrets/resend_main_api_key (compose.yaml sets SECRETS_DIR=/run/secrets).
# Copy and adapt the names to your provider instances, then add the file to the command:
#   docker compose --env-file .env.production -f compose.yaml -f compose.secrets.yaml up -d
# The secret files live outside the repository (SECRETS_HOST_DIR) and must be readable by the
# container user `node` (uid 1000), e.g. owner root, mode 0644 in a 0750 directory with group 1000.
# api (webhook signatures), worker-email (sending) and dispatcher (reconciliation) resolve secrets.
x-provider-secrets: &provider-secrets
  - resend_main_api_key
  - resend_main_webhook_secret

services:
  api:
    secrets: *provider-secrets
  dispatcher:
    secrets: *provider-secrets
  worker-email:
    secrets: *provider-secrets

secrets:
  resend_main_api_key:
    file: ${SECRETS_HOST_DIR:?set SECRETS_HOST_DIR}/resend_main_api_key
  resend_main_webhook_secret:
    file: ${SECRETS_HOST_DIR:?set SECRETS_HOST_DIR}/resend_main_webhook_secret
