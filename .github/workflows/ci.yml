name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly e2e run (the e2e job also runs on pushes to main and on manual dispatch).
    - cron: '17 2 * * *'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to full commit SHAs (version in the comment); Dependabot proposes updates.
# No secrets are used and no step contacts real providers: tests use fakes, Mailpit or loopback servers.
env:
  NODE_VERSION: 24.22.0

jobs:
  quality:
    name: Typecheck, lint, build, unit and contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:contract

  integration:
    name: Integration tests (PostgreSQL, Valkey)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: notifications
          POSTGRES_PASSWORD: notifications
          # The integration suite uses only this database (it resets and migrates it itself).
          POSTGRES_DB: notifications_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notifications -d notifications_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      valkey:
        image: valkey/valkey:9.1.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://notifications:notifications@localhost:5432/notifications_test
      TEST_VALKEY_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Some tests start throwaway Valkey containers through the Docker CLI (available on the runner).
      - run: npm run test:integration

  e2e:
    name: E2E acceptance scenarios (Compose infra)
    # Slow (~15 min, serial): not on every pull request.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      E2E_LOG_DIR: ${{ github.workspace }}/e2e-logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Start PostgreSQL, Valkey and Mailpit
        run: docker compose up -d --wait --wait-timeout 120 postgres valkey mailpit
      - run: npm run test:e2e
      - name: Collect Compose logs
        if: failure()
        run: docker compose logs --no-color postgres valkey mailpit > "$E2E_LOG_DIR/compose.log" 2>&1 || true
      - name: Upload e2e logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: e2e-logs/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop infrastructure
        if: always()
        run: docker compose down -v

  docker:
    name: Docker image and clean-start smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: notification-service:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate Compose files
        env:
          DATABASE_URL: postgres://ci:ci@db.invalid:5432/ci
          VALKEY_URL: rediss://valkey.invalid:6379
        run: |
          docker compose config -q
          docker compose -f compose.yaml config -q
          SECRETS_HOST_DIR=/run/secrets-example docker compose -f compose.yaml -f compose.secrets.example.yaml config -q
          test "$(docker compose -f compose.yaml config --services | sort | tr '\n' ' ')" = "api dispatcher migrate worker-email "
      - name: Clean-start smoke test
        run: scripts/smoke-local.sh -p ns-smoke --no-build
