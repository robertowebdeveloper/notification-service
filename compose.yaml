# Application services. Used as-is in stage/production, where PostgreSQL and Valkey
# are external managed services (see docs/operations.md, "Stage e produzione"):
#   docker compose --env-file .env.production -f compose.yaml up -d
# The same file is both the interpolation source (--env-file: APP_ENV, DATABASE_SSL,
# SHUTDOWN_GRACE_MS, STOP_GRACE_PERIOD, OPS_*, image) and the containers' env_file
# (NOTIFICATION_ENV_FILE, default .env.production: DATABASE_URL, VALKEY_URL, tuning, `env:` secrets).
# Variables listed under `environment` win over env_file: set those through interpolation.
# Provider secrets as Docker secrets (`file:` refs): add compose.secrets.example.yaml (copied/adapted).
# Locally, `docker compose up` also loads compose.override.yaml (PostgreSQL, Valkey, Mailpit).
name: notification-service

x-app: &app
  image: ${NOTIFICATION_SERVICE_IMAGE:-notification-service:local}
  build:
    context: .
    dockerfile: docker/Dockerfile
  # Restarts on any exit (crash, fatal error, stuck loop detected by the process itself).
  # Compose does NOT restart containers that are merely unhealthy.
  restart: unless-stopped
  # Must exceed SHUTDOWN_GRACE_MS (+ margin), or Docker sends SIGKILL before the app's grace ends.
  stop_grace_period: ${STOP_GRACE_PERIOD:-45s}
  env_file:
    - path: ${NOTIFICATION_ENV_FILE:-.env.production}
      required: false
  environment:
    APP_ENV: ${APP_ENV:-production}
    DATABASE_SSL: ${DATABASE_SSL:-true}
    SECRETS_DIR: /run/secrets
    # > WORKER_SEND_TIMEOUT_MS (default 30000) + margin; < stop_grace_period.
    SHUTDOWN_GRACE_MS: ${SHUTDOWN_GRACE_MS:-40000}
    # Internal ops server (/metrics; /health/* for dispatcher and worker). Never published here:
    # scrape it on the internal network, do not route it through the ingress.
    OPS_HOST: ${OPS_HOST:-0.0.0.0}
    OPS_PORT: ${OPS_PORT:-9100}

# Readiness of dispatcher/worker through the ops server (the slim image has no curl).
# Not used by any depends_on: nothing waits on it.
x-ops-healthcheck: &ops-healthcheck
  test:
    - CMD
    - node
    - -e
    - fetch('http://127.0.0.1:'+(process.env.OPS_PORT||9100)+'/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))
  interval: 15s
  timeout: 3s
  start_period: 30s
  retries: 3

services:
  migrate:
    <<: *app
    restart: 'no'
    command: ['node', 'dist/entrypoints/migrate.js']
    healthcheck:
      disable: true

  api:
    <<: *app
    command: ['node', 'dist/entrypoints/api.js']
    ports:
      - '${API_PUBLISHED_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully

  dispatcher:
    <<: *app
    command: ['node', 'dist/entrypoints/dispatcher.js']
    healthcheck: *ops-healthcheck
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker-email:
    <<: *app
    command: ['node', 'dist/entrypoints/worker.js']
    healthcheck: *ops-healthcheck
    depends_on:
      migrate:
        condition: service_completed_successfully
